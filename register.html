<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart || Register Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
  </head>
  <body>
    <header>
      <div
        class="container-fluid"
        style="
          background-color: #f6f9fa;
          padding: 10px 15px 10px 40px;
          display: flex;
        "
      >
        <div class="logo">
          <img src="images/Logo.png" alt="logo" width="170" height="90" />
        </div>
      </div>
    </header>

    <form class="loginform">
      First Name <span style="margin-left: 41%">Last Name</span><br />
      <input type="text" placeholder="Enter first name" id="reg_first" />
      <input type="text" placeholder="Enter last name" id="reg_last" />
      Email
      <input type="email" placeholder="Enter email" id="reg_email" />
      Password
      <input type="password" placeholder="Enter password" id="reg_password" />
      <input type="submit" value="Register" id="register" />
      Have an account? <a href="login.html">Login</a>
    </form>

    <script src="/JS/regester.js"></script>
    <script src="/JS/bootstrap.bundle.min.js"></script>
  </body>
</html>
