<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Cart || cart page</title>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/all.css"/>
        <link rel="stylesheet" href="css/bootstrap.min.css"/>
    </head>
    <body>
        <header style="margin-bottom: 50px;">
            <div class="container-fluid" style="background-color: #f6f9fa; padding: 10px 15px 10px 40px; display: flex;">
                <div class="logo">
                    <a href="index.html"><img src="images/Logo.png" alt="logo" width="170" height="90"></a>
                </div>
                <div class="cartContainer" style="margin-left: auto; margin-top: 2%; display: none;">
                    <span id="username"></span>
                    <span style="margin: 0 30px; color: rgb(0, 106, 255);"><i class="fa-solid fa-cart-shopping shoppingcart" style="cursor: pointer;"></i> <span id="counter"></span></span>
                    <div class="cartsProducts">
                        <div class="cartAddedProducts"></div>
                        <hr>
                        <div class="viewproducts"><a href="cart.html" style="color: black;">View All Products</a></div>
                    </div>
                    <button class="headerbtnLogout">Logout</button>
                </div>
                <div class="header_content" style="margin-left: auto;">
                    <button class="headerbtn headerbtn1">Login</button>
                    <button class="headerbtn headerbtn2">Register</button>
                </div>
            </div>
        </header>

        <div class="addedproducts row">
            
        </div>

        <h2 style="margin-top: 40px; text-align: center;">Total Price: $<span class="price"></span></h2>
        <hr style="margin-top: 20px; color: #8e8e8e;">

        <h2 class="favItem">Favorite Items</h2>
        <p class="underline"></p>

        <div class="addedfavproducts row">
            
            
        </div>

        <script src="js/cart.js"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
    </body>
</html>
