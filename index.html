<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Cart || Home Page</title>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/all.css"/>
        <link rel="stylesheet" href="css/bootstrap.min.css"/>
    </head>
    <body>
        <header style="margin-bottom: 50px;">
            <div class="container-fluid" style="background-color: #f6f9fa; padding: 10px 15px 10px 40px; display: flex;">
                <div class="logo">
                    <img src="images/Logo.png" alt="logo" width="170" height="90">
                </div>
                <div class="cartContainer" style="margin-left: auto; margin-top: 2%; display: none;">
                    <span id="username"></span>
                    <span style="margin: 0 30px; color: rgb(0, 106, 255);"><i class="fa-solid fa-cart-shopping shoppingcart" style="cursor: pointer;"></i> <span id="counter"></span></span>
                    <div class="cartsProducts">
                        <div class="cartAddedProducts"></div>
                        <hr>
                        <div class="viewproducts"><a href="cart.html" style="color: black;">View All Products</a></div>
                    </div>
                    <button class="headerbtnLogout">Logout</button>
                </div>
                <div class="header_content" style="margin-left: auto;">
                    <button class="headerbtn headerbtn1">Login</button>
                    <button class="headerbtn headerbtn2">Register</button>
                </div>
            </div>
        </header>
        <main>
            <div style="width: 70%; margin: auto;">
                <div class="row">
                    <div class="products row">
                        <div class="lg-col-4 sm-col-6 col-12 cards">
                            <div class="image"><img src="images/Screenshot 2025-08-23 152418.png"></div>
                            <div class="card_content">
                                <h5>Golden watch</h5>
                                <p>Price: 400$</p>
                                <p>Category: Watches</p>
                                <i class="fa fa-heart"></i>
                                <button class="addBtn">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    
        <script src="JS/script.js"></script>
        <script src="JS/bootstrap.bundle.min.js"></script>
    </body>
</html>
