<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Cart || Login Page</title>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/all.css"/>
        <link rel="stylesheet" href="css/bootstrap.min.css"/>
    </head>
    <body>
        <header>
            <div class="container-fluid" style="background-color: #f6f9fa; padding: 10px 15px 10px 40px; display: flex;">
                <div class="logo">
                    <img src="images/Logo.png" alt="logo" width="170" height="90">
                </div>
            </div>
        </header>

        <form class="loginform">
            Email
            <input type="email" placeholder="Enter email" id="login_email">
            Password
            <input type="password" placeholder="Enter password" id="login_password">
            <input type="checkbox" style="display: inline; cursor: pointer;"> Remember Me
            <input type="submit" value="Login" id="login">
            Don't have an account? <a href="register.html">Register</a>
        </form>

        <script src="JS/login.js"></script>
        <script src="JS/bootstrap.bundle.min.js"></script>
    </body>
</html>
